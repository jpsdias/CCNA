---
- name: CCNA3 Project - Tasks Playbook
  hosts: all
  gather_facts: no

  tasks:
    # Part 4: IPSEC VPN Tunnels -----------------------------------
    - name: Configure ISAKMP Policy 100
      cisco.ios.ios_config:
        lines:
          - encr aes 128
          - hash sha
          - authentication pre-share
          - group 5
        parents: crypto isakmp policy 100
      when: ipsec_peers is defined
      tags: ipsec

    - name: Configure ISAKMP Pre-shared Keys
      cisco.ios.ios_config:
        lines:
          - crypto isakmp key {{ item.key }} address {{ item.address }}
      loop: "{{ ipsec_peers }}"
      when: ipsec_peers is defined
      tags: ipsec

    - name: Configure IPsec Transform Set
      cisco.ios.ios_config:
        lines:
          - crypto ipsec transform-set TSET esp-aes esp-sha-hmac
      when: ipsec_peers is defined
      tags: ipsec

    - name: Configure Crypto Map
      cisco.ios.ios_config:
        lines:
          - set peer {{ item.address }}
          - set transform-set TSET
          - match address {{ item.acl_name }}
        parents: crypto map CROATIA {{ item.seq }} ipsec-isakmp
      loop: "{{ ipsec_peers }}"
      when: ipsec_peers is defined
      tags: ipsec

    - name: Configure Tunnels
      cisco.ios.ios_interfaces:
        config:
          - name: "{{ item.name }}"
            description: "{{ item.description }}"
        state: merged
      loop: "{{ tunnels }}"
      when: tunnels is defined
      tags: tunnels

    - name: Configure Tunnel IP addresses
      cisco.ios.ios_l3_interfaces:
        config:
          - name: "{{ item.name }}"
            ipv4:
              - address: "{{ item.ipv4.address }}/{{ item.ipv4.prefix }}"
        state: merged
      loop: "{{ tunnels }}"
      when: tunnels is defined
      tags: tunnels

    - name: Configure Tunnel source and destination
      cisco.ios.ios_config:
        lines:
          - "tunnel source {{ item.tunnel.source }}"
          - "tunnel destination {{ item.tunnel.destination }}"
        parents: "interface {{ item.name }}"
      loop: "{{ tunnels }}"
      when: tunnels is defined
      tags: tunnels

    - name: Apply Crypto Map to WAN interfaces
      cisco.ios.ios_config:
        lines:
          - crypto map CROATIA
        parents: interface {{ rInt['Gig0/2'] }}
      when: 
        - ipsec_peers is defined
      tags: ipsec

    - name: Configure ACLs for IPsec
      cisco.ios.ios_acls:
        config:
          - afi: ipv4
            acls:
            - name: "{{ item.acl_name }}"
              acl_type: extended
              aces: "{{ item.entries | map(attribute='ace') | list }}"
        state: replaced
      loop: "{{ ipsec_acls }}"
      when: ipsec_acls is defined
      tags: ipsec_acl

    # Part 5: Routing -------------------------------------
    - name: Configure OSPF process - Routers
      cisco.ios.ios_ospfv2:
        config:
          processes:
            - process_id: "{{ item.process_id }}"
              router_id: "{{ item.router_id }}"
              default_information:
                originate: true
        state: replaced
      loop: "{{ ospf_processes }}"
      when: 
        - ospf_processes is defined
        - "'routers' in group_names"
      tags: ospf

    - name: Configure OSPF process - MLS
      cisco.ios.ios_ospfv2:
        config:
          processes:
            - process_id: "{{ item.process_id }}"
              router_id: "{{ item.router_id }}"
        state: replaced
      loop: "{{ ospf_processes }}"
      when:
        - ospf_processes is defined
        - "'mls' in group_names"
      tags: ospf

    - name: Configure OSPF passive interfaces
      cisco.ios.ios_config:
        lines:
          - "passive-interface {{ item }}"
        parents: "router ospf {{ ospf_processes[0].process_id }}"
      loop: "{{ ospf_processes[0].passive_interfaces | default([]) }}"
      when: ospf_processes is defined and ospf_processes[0].passive_interfaces | default([]) | length > 0
      tags: ospf

    - name: Enable OSPF on active interfaces
      cisco.ios.ios_ospf_interfaces:
        config:
          - name: "{{ item }}"
            address_family:
              - afi: ipv4
                process:
                  id: "{{ ospf_processes[0].process_id }}"
                  area_id: "0"
        state: replaced
      loop: "{{ ospf_processes[0].active_interfaces }}"
      when: ospf_processes is defined and ospf_processes[0].active_interfaces is defined
      tags: ospf

    # Part 6 Static and Dynamic NAT ---------------------------------
    - name: Configure NAT ACL
      cisco.ios.ios_acls:
        config:
          - afi: ipv4
            acls:
              - name: "{{ nat_acl.name }}"
                acl_type: standard
                aces: "{{ nat_acl.entries | map(attribute='ace') | list }}"
        state: replaced
      when: nat_acl is defined
      tags: nat_acl

    - name: Configure NAT inside interfaces
      cisco.ios.ios_config:
        lines:
          - ip nat inside
        parents: "interface {{ item }}"
      loop: "{{ nat.inside_interfaces }}"
      when: nat is defined
      tags: nat

    - name: Configure NAT outside interface
      cisco.ios.ios_config:
        lines:
          - ip nat outside
        parents: "interface {{ nat.outside_interface }}"
      when: nat is defined
      tags: nat

    - name: Configure PAT
      cisco.ios.ios_config:
        lines:
          - "ip nat inside source list {{ nat_acl.name }} interface {{ nat.outside_interface }} overload"
      when: nat is defined and nat_acl is defined
      tags: nat

    # - name: Bind NAT ACL to outside interface
    #   cisco.ios.ios_config:
    #     lines:
    #       - "ip nat inside source static tcp {{ item.inside_ip }} {{ item.port_local }} interface {{ item.outside_interface }} {{ item.port_global }}"
    #   loop: "{{ static_nat }}"
    #   when: static_nat is defined
    #   tags: static_nat

    # - name: Configure HTTP server on DHCP-SRV
    #   cisco.ios.ios_config:
    #     lines:
    #       - ip http server
    #       - ip http secure-server
    #       - ip http authentication local
    #   when: http_server is defined and http_server.enabled
    #   tags: http

    # Part 8: NTP ------------------------------------
    - name: Configure NTP upstream servers
      cisco.ios.ios_ntp_global:
        config:
          servers:
            - server: "{{ item }}"
          master:
            stratum: "{{ ntp.master.stratum }}"
          source: "{{ ntp.master.source }}"
        state: merged
      loop: "{{ ntp.servers }}"
      when: ntp.master.enabled
      tags: ntp

    - name: Configure NTP client
      cisco.ios.ios_ntp_global:
        config:
          servers:
            - server: "{{ ntp.client.server }}"
        state: replaced
      when: not ntp.master.enabled
      tags: ntp

    - name: Save Configuration
      cisco.ios.ios_config:
        save_when: always
      tags: save